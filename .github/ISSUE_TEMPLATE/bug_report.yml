name: Bug 报告
description: 报告可重复的软件错误或异常行为
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 SeisForge Studio。请勿上传真实生产 SEG-Y、项目坐标、许可证、机器码或其他敏感信息。安全问题请使用仓库 Security 页面私下报告。

  - type: input
    id: version
    attributes:
      label: SeisForge Studio 版本
      description: 请填写窗口标题、Release 版本或 EXE 文件名。
      placeholder: 例如 v1.9.15 / SeisForgeStudio_v1.9.15_windows_x64.exe
    validations:
      required: true

  - type: dropdown
    id: workspace
    attributes:
      label: 工作区
      options:
        - 普通二维
        - 弯线二维
        - 真三维
        - 伪三维
        - SEG-Y 分析
        - 启动、许可或其他
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 环境
      placeholder: 例如 Windows 11 23H2 x64，1920×1080，缩放 150%
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请简洁说明发生了什么，以及它对工作的影响。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 选择……
        3. 点击……
        4. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: dataset
    attributes:
      label: 数据概况（请脱敏）
      description: 可填写格式码、道数、样点数、采样间隔、文件大小及规则/弯线几何。不要上传生产数据。

  - type: textarea
    id: diagnostics
    attributes:
      label: 截图与诊断信息
      description: 可拖入已脱敏截图，并粘贴相关错误或日志片段。请勿粘贴完整大型日志。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已检查现有 Issue，没有找到相同问题。
          required: true
        - label: 我已移除客户数据、项目坐标、许可证和其他敏感信息。
          required: true
        - label: 这不是需要私下报告的安全漏洞。
          required: true
