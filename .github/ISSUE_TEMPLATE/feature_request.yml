name: 功能建议
description: 建议新的工作流、显示能力或性能改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 SeisForge Studio 提出建议。请从实际地震数据工作流出发描述需求，并避免公开敏感项目资料。

  - type: dropdown
    id: workspace
    attributes:
      label: 主要影响的模块
      options:
        - 普通二维
        - 弯线二维
        - 真三维
        - 伪三维
        - SEG-Y 分析
        - 导入、导出或项目管理
        - 性能、稳定性或构建
        - 跨模块功能
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前工作流哪里耗时、容易出错或无法完成？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述理想行为、主要交互和预期结果。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 可选。说明目前如何绕过问题，以及为什么仍不理想。

  - type: textarea
    id: compatibility
    attributes:
      label: 数据与兼容性要求
      description: 可选。说明 SEG-Y 格式、数据规模、性能目标或必须保持不变的现有行为。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同建议。
          required: true
        - label: 此建议不包含客户数据、真实项目坐标或其他敏感信息。
          required: true
