name: Prestack monitor

on:
  push:
    branches:
      - prestack-pidx
  pull_request:
    branches:
      - main
      - prestack-pidx
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: prestack-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-test-build:
    name: Windows tests and GUI build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        shell: pwsh
        run: |
          $files = git ls-files '*.go'
          if (-not $files) {
            throw 'No Go source files were found.'
          }
          $unformatted = gofmt -l $files
          if ($unformatted) {
            Write-Host 'The following Go files are not gofmt-clean:'
            $unformatted | ForEach-Object { Write-Host " - $_" }
            exit 1
          }

      - name: Run tests
        shell: pwsh
        run: go test ./... -count=1

      - name: Run vet
        shell: pwsh
        continue-on-error: true
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'go-vet.log'
          go vet ./... 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            "go vet reported existing or new diagnostics; inspect the job log." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Check whitespace errors
        shell: pwsh
        run: git diff --check

      - name: Build Windows GUI
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'SeisForgeStudio_prestack_monitor_x64.exe'
          .\build_windows_release.ps1 -Output $output
          "SEISFORGE_MONITOR_EXE=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify PE subsystem and checksum
        shell: pwsh
        run: |
          $output = $env:SEISFORGE_MONITOR_EXE
          $bytes = [System.IO.File]::ReadAllBytes($output)
          if ($bytes.Length -lt 512) {
            throw 'Built executable is too small to be a valid PE image.'
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $optionalHeader = $peOffset + 24
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) {
            throw 'Built file has no PE signature.'
          }
          $subsystem = [BitConverter]::ToUInt16($bytes, $optionalHeader + 68)
          if ($subsystem -ne 2) {
            throw "PE subsystem is $subsystem; expected Windows GUI subsystem 2."
          }
          $hash = (Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $output).Length
          "Windows GUI build: $output"
          "Size: $size bytes"
          "SHA256: $hash"
          "PE Subsystem: 2 (Windows GUI)"
          "size=$size" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "pe_subsystem=2" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Windows GUI build
        uses: actions/upload-artifact@v4
        with:
          name: SeisForgeStudio-prestack-monitor-windows-x64
          path: ${{ env.SEISFORGE_MONITOR_EXE }}
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: CodeQL security scan
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Build for CodeQL
        shell: pwsh
        run: go build ./cmd/limage

      - name: Analyze
        uses: github/codeql-action/analyze@v3
